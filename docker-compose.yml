# PeakHook - one service, one command:  docker compose up -d
# Dashboard: http://localhost:3000   (log in with any username + ADMIN_PASSWORD)
#
# Want n8n + Postgres too?  Use the full stack file instead:
#   docker compose -f docker-compose.n8n-stack.yml up -d
services:
  peakhook:
    build: .
    image: peakhook:latest
    container_name: peakhook
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      # CHANGE THIS. "changeme" is only here so the first start works.
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-changeme}
      # Optional: forward every webhook that has no endpoint-specific URL (e.g. your n8n webhook).
      DEFAULT_FORWARD_URL: ${DEFAULT_FORWARD_URL:-}
      RETENTION_DAYS: ${RETENTION_DAYS:-30}
      MAX_BODY_BYTES: ${MAX_BODY_BYTES:-1048576}
      FORWARD_TIMEOUT_MS: ${FORWARD_TIMEOUT_MS:-10000}
      # Set to true when PeakHook runs behind a reverse proxy (Hostinger, Caddy, Nginx, Traefik).
      TRUST_PROXY: ${TRUST_PROXY:-false}
      # Optional: public base URL shown in the dashboard, e.g. https://hooks.example.com
      PUBLIC_URL: ${PUBLIC_URL:-}
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
