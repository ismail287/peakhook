name: Docker verify

# Proves in a real Docker environment that the Alpine multi-stage build (better-sqlite3),
# the non-root user and the ./data volume permissions all work.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  docker-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build images
        run: docker compose build

      - name: Start the container
        run: docker compose up -d

      - name: Wait for the app to come up
        run: sleep 5

      - name: Health check (curl -f fails the job on any non-2xx)
        run: |
          # The first call is the required check. If the container is still booting,
          # retry for up to 30 more seconds before failing.
          for i in 1 2 3 4 5 6; do
            if curl -f -sS http://localhost:3000/api/health; then echo; exit 0; fi
            echo "not ready yet (attempt $i), retrying in 5s..."; sleep 5
          done
          curl -f http://localhost:3000/api/health

      - name: SQLite write works on the mounted ./data volume
        run: |
          # Authenticated call that inserts rows into SQLite (proves better-sqlite3 + volume permissions).
          curl -f -sS -u "admin:changeme" -X POST http://localhost:3000/api/seed-demo
          echo
          curl -f -sS -u "admin:changeme" "http://localhost:3000/api/logs?limit=5" | grep -q '"logs"'
          ls -la data
          test -s data/peakhook.db

      - name: App process runs as the non-root "node" user
        run: |
          # `docker exec` starts as the image default (root), so inspect the running server process instead.
          docker compose exec -T peakhook ps -o user,args
          docker compose exec -T peakhook ps -o user,args | grep "[n]ode server.js" | grep -q "^node"
          # The database file is created by that process: it must be owned by uid 1000 (node), not root.
          owner=$(docker compose exec -T peakhook stat -c %u /app/data/peakhook.db)
          echo "peakhook.db owner uid: $owner"
          test "$owner" != "0"

      - name: Docker HEALTHCHECK reports healthy
        run: |
          for i in 1 2 3 4 5 6; do
            status=$(docker inspect --format '{{.State.Health.Status}}' peakhook)
            echo "health: $status"
            [ "$status" = "healthy" ] && exit 0
            sleep 5
          done
          exit 1

      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v

  browser-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Files match SHA256SUMS.txt
        working-directory: browser-tools
        run: sha256sum -c SHA256SUMS.txt

      - name: Every offline edition blocks network access (CSP connect-src 'none')
        working-directory: browser-tools
        run: |
          for f in *.html; do
            grep -q "connect-src 'none'" "$f" || { echo "missing CSP in $f"; exit 1; }
            # no external scripts, stylesheets or fonts may be loaded
            if grep -Eq '<(script|link)[^>]+(src|href)="https?://' "$f"; then echo "external resource in $f"; exit 1; fi
          done
          echo "all offline editions are self-contained"

      - name: Build and serve with Docker
        run: |
          docker build -t peak-browser-tools browser-tools
          docker run -d --name peak-browser-tools -p 8080:80 peak-browser-tools
          sleep 3
          curl -f -sS http://localhost:8080/ | grep -q "Peak Automations browser tools"
          curl -f -sS -o /dev/null http://localhost:8080/curl-to-n8n-converter.html
          curl -f -sS -o /dev/null http://localhost:8080/js/curl-parser.js
          echo "browser tools served OK"

      - name: Tear down
        if: always()
        run: docker rm -f peak-browser-tools || true
